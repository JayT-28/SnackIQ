<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Viewport configuration to prevent mobile zoom-out issues:
      - width=device-width: Use device's screen width
      - initial-scale=1: Start at 100% zoom
      - maximum-scale=1: Prevent zoom out
      - minimum-scale=1: Prevent zoom in
      - user-scalable=no: Disable pinch zoom for app-like experience
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>SnackIQ</title>

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
      }
      /* Prevent text size adjustment on mobile */
      html {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
